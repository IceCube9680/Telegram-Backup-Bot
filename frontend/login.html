<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Telegram Backup Bot</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">📦</div>
        <h1 class="login-title">Telegram Backup Bot</h1>
        <p class="login-subtitle">Sign in to access your backed-up files and dashboard</p>
      </div>

      <!-- One-time code login form -->
      <form id="token-login-form" class="login-form">
        <div class="form-group">
          <label class="form-label" for="login-code-input">6-Digit One-Time Login Code</label>
          <input 
            type="text" 
            id="login-code-input" 
            class="input-field code-input" 
            placeholder="000000" 
            maxlength="6" 
            pattern="[0-9]{6}" 
            required 
            autocomplete="one-time-code"
          >
        </div>

        <button type="submit" id="btn-submit-code" class="btn btn-primary" style="justify-content: center; padding: 12px; font-size: 15px;">
          🔐 Sign In
        </button>
      </form>

      <div style="margin-top: 20px; padding: 14px; background: rgba(56, 139, 253, 0.1); border: 1px solid rgba(56, 139, 253, 0.2); border-radius: var(--radius-md); font-size: 13px; color: var(--text-secondary);">
        💡 <b>How to get your code:</b><br>
        Open the Telegram bot and send the command <code>/login</code> or <code>/web</code> to receive your instant login code.
      </div>

      <!-- Quick Dev Login for local development & testing -->
      <div id="dev-login-section" style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color); display: none;">
        <div style="font-size: 12px; color: var(--accent-warning); margin-bottom: 8px; font-weight: 600;">🛠 DEVELOPMENT MODE</div>
        <button type="button" id="btn-dev-login" class="btn btn-secondary btn-sm" style="width: 100%; justify-content: center;">
          ⚡ Quick Dev Login (User 123456789)
        </button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
