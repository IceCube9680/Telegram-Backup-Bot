services:
  mongodb:
    image: mongo:7.0
    container_name: telegram_backup_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=telegram_backup
    volumes:
      - mongo_data:/data/db
    networks:
      - backup_net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_backup_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-telegram_backup}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - STORAGE_PATH=/app/storage
      - BOT_TOKEN=${BOT_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - WEB_SESSION_SECRET=${WEB_SESSION_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - API_PORT=8000
    volumes:
      - ./storage:/app/storage
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backup_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_backup_bot
    restart: unless-stopped
    command: ["python", "-m", "app.bot.bot"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - BOT_TOKEN=${BOT_TOKEN:-}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-telegram_backup}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - STORAGE_PATH=/app/storage
    volumes:
      - ./storage:/app/storage
    healthcheck:
      disable: true
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backup_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_backup_worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.worker"]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - BOT_TOKEN=${BOT_TOKEN:-}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-telegram_backup}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - STORAGE_PATH=/app/storage
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - WORKER_POLL_INTERVAL=${WORKER_POLL_INTERVAL:-2}
      - WORKER_LOCK_TIMEOUT=${WORKER_LOCK_TIMEOUT:-300}
      - WORKER_MAX_ATTEMPTS=${WORKER_MAX_ATTEMPTS:-3}
      - MT_PROTO_ENABLED=${MT_PROTO_ENABLED:-false}
      - MT_PROTO_API_ID=${MT_PROTO_API_ID:-}
      - MT_PROTO_API_HASH=${MT_PROTO_API_HASH:-}
      - MT_PROTO_SESSION_PATH=/app/secrets/mtproto_worker.session
      - MT_PROTO_CHUNK_SIZE=${MT_PROTO_CHUNK_SIZE:-1048576}
      - MT_PROTO_CONCURRENCY=${MT_PROTO_CONCURRENCY:-1}
      - LARGE_FILE_THRESHOLD=${LARGE_FILE_THRESHOLD:-20971520}
      - LARGE_FILE_RESUME_ENABLED=${LARGE_FILE_RESUME_ENABLED:-true}
      - LARGE_FILE_DISK_SAFETY_MARGIN=${LARGE_FILE_DISK_SAFETY_MARGIN:-1073741824}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-4294967296}
    volumes:
      - ./storage:/app/storage
      - ./secrets:/app/secrets
    healthcheck:
      disable: true
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backup_net

volumes:
  mongo_data:
    driver: local

networks:
  backup_net:
    driver: bridge
